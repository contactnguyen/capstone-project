name: Deploy Click-to-Call demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo files
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        env:
          ENDPOINT_URL: ${{ secrets.COGNIGY_ENDPOINT_CONFIG_URL }}
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ.get("ENDPOINT_URL", "").strip()
          Path("dist/config.js").write_text(
              "window.QWIK_COGNIGY_ENDPOINT = " + json.dumps(value) + ";\n",
              encoding="utf-8",
          )
          Path("dist/robots.txt").write_text(
              "User-agent: *\nDisallow: /\n", encoding="utf-8"
          )
          Path("dist/.nojekyll").touch()
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
