name: Deploy Qwik Service Capstone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Capstone files
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        env:
          ENDPOINT_URL: ${{ secrets.COGNIGY_ENDPOINT_CONFIG_URL }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html capstone-project.css capstone-project.js dist/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ.get("ENDPOINT_URL", "").strip()
          if not value:
              raise SystemExit(
                  "Missing required secret: COGNIGY_ENDPOINT_CONFIG_URL"
              )
          if not value.startswith("https://"):
              raise SystemExit("Endpoint configuration URL must use HTTPS")

          Path("dist/capstone-config.js").write_text(
              "window.QWIK_COGNIGY_ENDPOINT = " + json.dumps(value) + ";\n",
              encoding="utf-8",
          )
          Path("dist/robots.txt").write_text(
              "User-agent: *\nDisallow: /\n", encoding="utf-8"
          )
          Path("dist/.nojekyll").touch()
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
